<!doctype html>
<html lang="en">
<head>
	<!-- Google tag (gtag.js) -->
	<script async src="https://www.googletagmanager.com/gtag/js?id=G-MVKRK0TSRL"></script>
	<script>
		window.dataLayer = window.dataLayer || [];
		function gtag(){dataLayer.push(arguments);}
		gtag('js', new Date());
		gtag('config', 'G-MVKRK0TSRL');
	</script>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Secure Checkout · Fast Graphic Design</title>
	<meta name="description" content="Secure checkout for Fast Graphic Design packages">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
	<link rel="stylesheet" href="css/style.css">
</head>
<body>
	<header>
		<div class="container header-inner">
			<div class="brand"><a href="index.html"><img src="assets/logo.png" alt="Fast logo"></a></div>
			<nav class="nav" id="nav"><a href="index.html">Home</a><a href="packages.html">Packages</a><a href="contact.html">Contact</a></nav>
		</div>
	</header>

	<main class="container">
		<section style="max-width:760px;margin:32px auto;padding:20px">
			<h1 style="margin-top:0;color:var(--accent);font-size:28px">Secure Checkout</h1>
			<p style="color:#666">Complete your order. Your payment is processed securely by Stripe.</p>

			<div style="margin-top:18px;padding:18px;border-radius:10px;border:1px solid #eee">
				<div style="display:flex;justify-content:space-between;align-items:center">
					<div>
						<div id="package-name" style="font-weight:800;font-size:18px">Package</div>
						<div id="package-desc" style="color:#666;font-size:14px">Description</div>
					</div>
					<div id="package-price" style="font-weight:800;color:var(--green);font-size:18px">£0.00</div>
				</div>
			</div>

			<div style="margin-top:18px">
				<label for="customer-name">Full name</label>
				<input id="customer-name" type="text" placeholder="Your name" style="width:100%;padding:10px;margin-top:6px;border:1px solid #ddd;border-radius:6px">
			</div>
			<div style="margin-top:12px">
				<label for="customer-email">Email</label>
				<input id="customer-email" type="email" placeholder="you@example.com" style="width:100%;padding:10px;margin-top:6px;border:1px solid #ddd;border-radius:6px">
			</div>

			<div id="payment-element" style="margin-top:18px;padding:14px;border:1px solid #eee;border-radius:8px">
				<!-- Stripe Payment Element mounts here -->
			</div>

			<div style="margin-top:16px;display:flex;gap:12px;align-items:center">
				<button id="submit-payment" class="btn" style="padding:12px 18px;background:var(--accent);color:#fff;border:none;border-radius:8px">Pay</button>
				<div id="checkout-message" style="color:#666"></div>
			</div>
		</section>
	</main>

	<footer class="footer">
		<div class="container">
			<div style="border-top:1px solid #333;padding-top:20px">
				<div style="color:#888;font-size:13px">© 2025 Fast Graphic Design. All rights reserved.</div>
			</div>
		</div>
	</footer>

	<script src="js/services.js"></script>
	<script src="js/main.js"></script>
	<script src="https://js.stripe.com/v3/"></script>
	<script src="js/checkout.js"></script>
</body>
</html>
