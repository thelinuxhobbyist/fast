<script>
// Set deadline placeholder to a date 10+ days in the future
document.addEventListener('DOMContentLoaded', function() {
  const deadlineInput = document.getElementById('deadline');
  if (deadlineInput) {
    const today = new Date();
    const futureDate = new Date(today.getTime() + (10 * 24 * 60 * 60 * 1000)); // 10 days from today
    
    const options = { year: 'numeric', month: 'long', day: 'numeric' };
    const formattedDate = futureDate.toLocaleDateString('en-US', options);
    
		// set placeholder (for non-date-supporting browsers) and set minimum selectable date
		deadlineInput.placeholder = 'e.g., ' + formattedDate;
		// set min attribute in yyyy-mm-dd format so browser date pickers prevent earlier picks
		function toISODate(d){
			var y = d.getFullYear(); var m = (d.getMonth()+1).toString().padStart(2,'0'); var dt = d.getDate().toString().padStart(2,'0');
			return y + '-' + m + '-' + dt;
		}
		deadlineInput.min = toISODate(futureDate);
  }
});
</script>
<!-- AdSense loader removed as requested -->

<script>
// Formspree: submit the project form via fetch and show inline success/error
document.addEventListener('DOMContentLoaded', function() {
	// If Stripe redirected back with a payment_intent, show a simple success panel
	(function(){
		try {
			var url = new URL(window.location.href);
			var pi = url.searchParams.get('payment_intent');
			if (!pi) return;

			var seenKey = 'seen_pi_' + pi;
			if (sessionStorage.getItem(seenKey)) {
				try { history.replaceState(null, '', window.location.pathname); } catch(e) {}
				return;
			}
			try { sessionStorage.setItem(seenKey, '1'); } catch(e) {}

			var card = document.querySelector('section.card');
			if (card) {
				card.innerHTML = '\n            <div style="text-align:center;padding:40px 20px">\n              <div style="font-size:48px;color:var(--green);margin-bottom:12px">\u2714</div>\n              <h2 style="margin:0 0 12px 0">Payment verified — thank you</h2>\n              <p style="color:#666;max-width:720px;margin:0 auto 18px">Your payment was successful. Please submit your project details below so our team can begin work.</p>\n              <p style="margin-top:18px"><a href="/" class="cta" style="padding:10px 18px">Return to Home</a></p>\n            </div>';
			}

			// Remove query params from the URL after a short delay to avoid re-processing
			setTimeout(function(){ try { history.replaceState(null, '', window.location.pathname); } catch(e){} }, 800);
		} catch (e) { /* ignore */ }
	})();

	var form = document.getElementById('projectForm');
	if (!form) return;

	form.addEventListener('submit', function(e) {
		e.preventDefault();

		// Validate deadline: must be at least 10 days in the future
		var deadlineInput = form.querySelector('#deadline');
		function getMinDate() { var d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() + 10); return d; }
		function showDeadlineError(msg){
			if (!deadlineInput) return;
			var err = document.getElementById('deadlineError');
			if (!err) {
				err = document.createElement('div');
				err.id = 'deadlineError';
				err.style.color = '#b00020';
				err.style.fontSize = '13px';
				err.style.marginTop = '8px';
				deadlineInput.parentNode.appendChild(err);
			}
			err.textContent = msg;
		}
		function clearDeadlineError(){ var err = document.getElementById('deadlineError'); if (err) err.textContent = ''; }

		if (deadlineInput) {
			var minDate = getMinDate();
			var selected = deadlineInput.value ? new Date(deadlineInput.value) : NaN;
			if (isNaN(selected) || selected.setHours(0,0,0,0) < minDate.getTime()) {
				showDeadlineError('Please choose a date at least 10 days from today.');
				deadlineInput.focus();
				return;
			}
		}

		clearDeadlineError();
		var submitBtn = form.querySelector('button[type="submit"]');
		if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = 'Sending...'; }

		var formData = new FormData(form);

		fetch(form.action, {
			method: 'POST',
			headers: { 'Accept': 'application/json' },
			body: formData
		}).then(function(response) {
			if (response.ok) {
				// replace the entire card section with a focused confirmation panel
				var card = form.closest('section.card');
				if (card) {
					card.innerHTML = '\n            <div style="text-align:center;padding:40px 20px">\n              <div style="font-size:48px;color:var(--green);margin-bottom:12px">\u2714</div>\n              <h2 style="margin:0 0 12px 0">Thanks — we received your details</h2>\n              <p style="color:#666;max-width:720px;margin:0 auto 18px">Your project information has been sent to our team. We'll review it and be in touch with any follow-up questions or a proposed timeline.</p>\n              <p style="margin-top:18px"><a href="index.html" class="cta" style="padding:10px 18px">Return to Home</a></p>\n            </div>';
				} else {
					form.innerHTML = '<p style="font-size:18px;color:var(--green)">Thanks — your project details have been sent. Our team will review and be in touch soon.</p>';
				}
				// Optionally update the URL to indicate submission
				try { history.replaceState(null, '', window.location.pathname + '?submitted=true'); } catch(e){}
			} else {
				return response.json().then(function(data){
					var msg = (data && data.error) ? data.error : 'Submission failed';
					throw new Error(msg);
				});
			}
		}).catch(function(err) {
			// revert submit button and show error
			if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = 'Submit Project Details'; }
			alert('Submission error: ' + (err && err.message ? err.message : err));
			console.error('Formspree submit error:', err);
		});
	});

	// Clear deadline error when user changes the date
	var deadlineField = form.querySelector('#deadline');
	if (deadlineField) {
		deadlineField.addEventListener('input', function(){
			var err = document.getElementById('deadlineError'); if (err) err.textContent = '';
		});
	}
});
</script>
