<header><div class="container header-inner"><div class="brand"><img src="assets/logo.png" alt="Fast logo"></div><button class="menu-toggle" id="menuToggleC" aria-label="Open menu"><i class="fa fa-bars"></i></button><nav class="nav" id="navC"><a href="index.html">Home</a><a href="packages.html">Packages</a><a href="contact.html">Contact</a><a href="contact.html#custom" class="cta">Request Custom Work</a></nav></div></header>

<main class="container" style="margin-top:18px">
<section class="card">
  <h1 id="contactTitle">Contact & Custom Work</h1>
  <p class="text-muted">Use the form to request custom quotes or ask about partnership/white-label work.</p>
  <form id="contactForm" action="https://formspree.io/f/xldkyoqz" method="POST">
    <div class="form-field"><label for="name">Name</label><input type="text" id="name" name="name" required></div>
    <div class="form-field"><label for="email">Email</label><input type="email" id="email" name="email" required></div>
    <div class="form-field"><label for="type">Inquiry Type</label><select id="type" name="type" required><option value="general">General Inquiry</option><option value="package">Package Purchase</option><option value="custom">Custom Project Request</option></select></div>
    <div id="customArea" style="display:none" class="form-field"><label for="customDetails">Tell us about your custom project</label><textarea id="customDetails" name="customDetails"></textarea></div>
    <div class="form-field"><label for="message">Message</label><textarea id="message" name="message" required></textarea></div>
    <div class="form-actions"><button class="cta" type="submit">Send Message</button></div>
  </form>
</section>
</main>

<div id="site-footer"></div>

<script src="js/footer.js"></script>
<script src="js/copyright.js"></script>
<script src="js/services.js"></script>

<script>
document.getElementById('type').addEventListener('change', function(){ var custom = document.getElementById('customArea'); if(this.value==='custom') custom.style.display='block'; else custom.style.display='none'; });
if(window.location.hash && window.location.hash==='#custom'){ document.getElementById('contactTitle').scrollIntoView({behavior:'smooth'}); document.getElementById('type').value='custom'; document.getElementById('customArea').style.display='block'; }
</script>
